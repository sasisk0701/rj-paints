version: '3.8'

services:
  mysql:
    image: mysql:8.4
    container_name: rj_paints_mysql
    restart: always
    environment:
      MYSQL_USER: rj_admin
      MYSQL_PASSWORD: rj_paints_dev_password
      MYSQL_ROOT_PASSWORD: rj_paints_root_dev_password
      MYSQL_DATABASE: rj_paints_db
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

  backend:
    build:
      context: ..
      dockerfile: docker/Dockerfile.backend
    container_name: rj_paints_backend
    restart: always
    environment:
      PORT: 5000
      DATABASE_URL: mysql://rj_admin:rj_paints_dev_password@mysql:3306/rj_paints_db
      JWT_SECRET: super_secret_jwt_key_rj_paints_kovilpatti
    ports:
      - "5000:5000"
    volumes:
      - product_uploads:/app/uploads
    depends_on:
      - mysql

  frontend:
    build:
      context: ..
      dockerfile: docker/Dockerfile.frontend
    container_name: rj_paints_frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  mysql_data:
  product_uploads:
