version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: rj_paints_postgres
    restart: always
    environment:
      POSTGRES_USER: rj_admin
      POSTGRES_PASSWORD: SecurePostgresPassword2026!
      POSTGRES_DB: rj_paints_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build:
      context: ..
      dockerfile: docker/Dockerfile.backend
    container_name: rj_paints_backend
    restart: always
    environment:
      PORT: 5000
      DATABASE_URL: postgresql://rj_admin:SecurePostgresPassword2026!@postgres:5432/rj_paints_db?schema=public
      JWT_SECRET: super_secret_jwt_key_rj_paints_kovilpatti
    ports:
      - "5000:5000"
    depends_on:
      - postgres

  frontend:
    build:
      context: ..
      dockerfile: docker/Dockerfile.frontend
    container_name: rj_paints_frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  postgres_data:
